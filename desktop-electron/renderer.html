<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='stylesheet' href='renderer.css'><title>Debadge Studio Pro</title></head><body>
<h1>Debadge Studio Pro Desktop</h1>
<div class='row'><button id='pick'>Scegli cartella</button><span id='folder'></span></div>
<div class='grid'><ul id='files'></ul><pre id='inspect'></pre></div>
<h2>Debadge</h2><div class='row'><input id='dname' placeholder='nome'><button id='dsave'>Salva</button><button id='dlist'>Lista</button></div><pre id='dout'></pre>
<h2>Tattoo</h2><div class='row'><input id='tname' placeholder='nome'><input id='collection' placeholder='collection'><input id='overlay' placeholder='overlay'><input id='zone' placeholder='zone'><button id='tsave'>Salva</button><button id='tlist'>Lista</button></div><pre id='tout'></pre>
<h2>Handling preview</h2><div class='row'><input id='mass' placeholder='mass'><input id='drive' placeholder='drive'><input id='brake' placeholder='brake'><input id='traction' placeholder='traction'><button id='hprev'>Preview</button></div><pre id='hout'></pre>
<script src='renderer.js'></script></body></html>
