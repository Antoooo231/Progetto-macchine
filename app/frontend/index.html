<!doctype html><html lang="it"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Debadge Studio Pro</title><link rel="stylesheet" href="styles.css"/></head><body>
<header><h1>Debadge Studio Pro (App esterna)</h1></header>
<main>
<section class="panel"><h2>Scan + Preview file GTA/FiveM</h2><div class="row"><input id="rootPath" placeholder="Percorso cartella"/><button id="scanBtn">Scansiona</button></div><pre id="scanOut"></pre></section>
<section class="panel"><h2>Debadge preset</h2><div class="row"><input id="debadgeName" placeholder="Nome"/><button id="saveDebadge">Salva Debadge</button></div><pre id="debadgeOut"></pre></section>
<section class="panel"><h2>Tattoo preset (stile Pleb Forge workflow)</h2><div class="row"><input id="tattooName" placeholder="Nome"/><input id="collection" placeholder="Collection"/><input id="overlay" placeholder="Overlay"/><input id="zone" placeholder="Zona"/><button id="saveTattoo">Salva Tattoo</button></div><pre id="tattooOut"></pre></section>
<section class="panel"><h2>Handling.meta editor + preview</h2><div class="row"><input id="model" placeholder="Model"/><input id="mass" placeholder="Mass"/><input id="drive" placeholder="DriveForce"/><input id="brake" placeholder="BrakeForce"/><input id="traction" placeholder="Traction"/></div><div class="row"><button id="previewHandling">Preview handling</button><button id="exportHandling">Export handling XML</button></div><pre id="handlingOut"></pre></section>
</main>
<script src="script.js"></script></body></html>
